<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    DocumentRoot "/www/wwwroot/adminwa.menasim.com"
    ServerName adminwa.menasim.com
    ServerAlias adminwa.menasim.com
    IncludeOptional /www/server/panel/vhost/apache/extension/adminwa.menasim.com/*.conf
    ErrorLog "/www/wwwlogs/adminwa.menasim.com-error_log"
    CustomLog "/www/wwwlogs/adminwa.menasim.com-access_log" combined

    # Force HTTPS, but let Let's Encrypt renewals through on HTTP.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^/?(.*) https://adminwa.menasim.com/$1 [R=301,L]

    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)$>
        Require all denied
    </Files>

    <Directory "/www/wwwroot/adminwa.menasim.com">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@example.com
    DocumentRoot "/www/wwwroot/adminwa.menasim.com"
    ServerName adminwa.menasim.com
    ServerAlias adminwa.menasim.com
    ErrorLog "/www/wwwlogs/adminwa.menasim.com-error_log"
    CustomLog "/www/wwwlogs/adminwa.menasim.com-access_log" combined

    #SSL
    SSLEngine On
    SSLCertificateFile /www/server/panel/vhost/cert/adminwa.menasim.com/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/adminwa.menasim.com/privkey.pem
    SSLCipherSuite EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5:ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+eNULL
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1
    SSLHonorCipherOrder On

    # ---------------- Reverse proxy to the FastAPI app ----------------
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 120

    # Keep cert-renewal challenges served from local files (not proxied).
    ProxyPass /.well-known/ !

    # Everything else -> the app on 127.0.0.1:8000
    ProxyPass        /  http://127.0.0.1:8000/
    ProxyPassReverse /  http://127.0.0.1:8000/

    # Land the bare domain on the admin console.
    RedirectMatch ^/$ /admin/

    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)$>
        Require all denied
    </Files>

    <Directory "/www/wwwroot/adminwa.menasim.com">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
